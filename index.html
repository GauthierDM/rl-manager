<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RL Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; background: #0f1720; color: #e6edf3; }
    input, select, button { font: inherit; padding: .5rem; margin: .25rem 0; box-sizing: border-box; }
    input, select { width: 100%; }
    button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; padding: .5rem 1rem; }
    button.danger { background: #8b2d2d; }
    #logout { background: #444; float: right; }
    .actions { display: flex; gap: .5rem; }
    .card { background: #161f2b; border-radius: 10px; padding: 1rem; margin: 1rem 0; }
    .layout { display: grid; grid-template-columns: 1fr 320px; gap: 1rem; align-items: start; }
    .sidebar { position: sticky; top: 1rem; max-height: 90vh; overflow: auto; margin: 1rem 0; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: static; max-height: none; }
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    td, th { padding: .3rem; border-bottom: 1px solid #26313f; text-align: left; }
    .scroll { overflow-x: auto; padding-bottom: .5rem; }
    .bracket { display: flex; gap: 18px; min-width: max-content; }
    .round { display: flex; flex-direction: column; justify-content: space-around; gap: 8px; width: 190px; }
    .round h5 { margin: 0 0 4px; color: #8b98a8; font-size: 12px; text-transform: uppercase; }
    .match { background: #1b2634; border-radius: 8px; padding: 4px; }
    .match.mine { outline: 2px solid #f0b429; }
    .side { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px; font-size: 13px; margin: 2px 0; }
    .side .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .side b { margin-left: auto; }
    .side i { margin-left: auto; color: #8b98a8; }
    .side.win { background: #1e7f4f; }
    .side.lose { background: #8b2d2d; }
    .logo { position: relative; width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; flex: none; font-size: 9px; font-weight: bold; color: #fff; }
    .logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .leaders { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .leaders ol { padding-left: 1.2rem; margin: 0; }
    .row { margin: .3rem 0; }
    .medal { display: inline-block; width: 1.6em; }
    #msg { color: #f0b429; }
  </style>
</head>
<body>
  <h1>RL Manager <button id="logout" style="display:none">Log out</button></h1>

  <section id="auth" class="card" style="display:none">
    <h2>Log in</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password (min. 6 characters)">
    <div class="actions">
      <button id="login">Log in</button>
      <button id="signup">Create account</button>
    </div>
    <p id="msg"></p>
  </section>

  <section id="setup" class="card" style="display:none">
    <h2>New career</h2>
    <p>Choose the team you will manage:</p>
    <select id="team-select"></select>
    <button id="new-career">Start career</button>
  </section>

  <section id="game" style="display:none">
    <div class="card">
      <h2 id="team-title"></h2>
      <p id="team-info"></p>
      <div class="actions">
        <button id="sim">Simulate season</button>
        <button id="reset" class="danger">Reset career</button>
      </div>
    </div>

    <div class="layout">
      <main>
        <div class="card">
          <h3>Season summary</h3>
          <div id="summary"></div>
        </div>
        <div id="brackets"></div>
        <div class="card">
          <h3>Your roster</h3>
          <table id="roster"></table>
        </div>
        <div class="card">
          <h3>Leaders (last season)</h3>
          <div id="leaders" class="leaders"></div>
        </div>
      </main>
      <aside class="card sidebar">
        <h3>All players</h3>
        <table id="all-players"></table>
      </aside>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
