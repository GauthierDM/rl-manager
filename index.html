<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RL Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>RL Manager</h1>
    <button id="logout" class="ghost" style="display:none">Log out</button>
  </header>

  <section id="auth" class="card" style="display:none">
    <h2>Log in</h2>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password (min. 6 characters)">
    <div class="actions">
      <button id="login">Log in</button>
      <button id="signup">Create account</button>
    </div>
    <p id="msg"></p>
  </section>

  <section id="setup" class="card" style="display:none">
    <h2>New career</h2>
    <p>Choose the team you will manage:</p>
    <select id="team-select"></select>
    <button id="new-career">Start career</button>
  </section>

  <section id="game" style="display:none">
    <div class="card">
      <h2 id="team-title"></h2>
      <p id="team-info"></p>
      <div class="actions">
        <button id="sim">Simulate season</button>
        <button id="reset" class="danger">Reset career</button>
      </div>
    </div>

    <div class="layout">
      <main>
        <div class="card">
          <h3>Season summary</h3>
          <div id="summary"></div>
        </div>
        <div class="card">
          <h3>Championship points</h3>
          <div id="standings"></div>
        </div>
        <div id="brackets"></div>
        <div class="card">
          <h3>Your roster</h3>
          <div class="scroll"><table id="roster"></table></div>
        </div>
        <div class="card">
          <h3>Leaders (last season)</h3>
          <div id="leaders" class="leaders"></div>
        </div>
      </main>
      <aside class="card sidebar">
        <h3>All players</h3>
        <table id="all-players"></table>
      </aside>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
